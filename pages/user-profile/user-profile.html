<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PuppyLand - Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/styles.css" />
    <link rel="stylesheet" href="../../styles/user-profile.css" />
  </head>
  <body class="body-with-image montserrat-regular">
    <!-- Header -->
    <header class="heading">
      <h1 class="heading__title imperial-script-regular">PuppyLand</h1>
    </header>

    <!-- Nav -->
    <nav id="navbar"></nav>

    <!-- Main Content -->
    <main class="profile">
      <!-- Profile Header & Stats -->
      <section class="profile__header">
        <h2 class="profile__username" id="profileUsername">Posts</h2>
        <div class="profile__stats">
          <div class="profile__stat">
            <span class="profile__stat-number" id="totalPosts">0</span>
            <span class="profile__stat-label">Posts</span>
          </div>
          <div class="profile__stat">
            <span class="profile__stat-number" id="breedsCount">0</span>
            <span class="profile__stat-label">Breeds Encountered</span>
          </div>
          <div class="profile__stat">
            <span class="profile__stat-number" id="totalHearts">0</span>
            <span class="profile__stat-label">Total Hearts</span>
          </div>
        </div>
      </section>

      <hr class="profile__divider" />

      <!-- Posts Feed -->
      <section class="grid__container" id="postsFeed">
        <!-- Post cards injected by user-profile.js -->
      </section>
    </main>

    <script type="module" src="../../scripts/index.js"></script>
    <script type="module" src="../../scripts/hamburger.js" defer></script>
    <script src="../../scripts/user-profile.js" type="module"></script>
  </body>
</html>
