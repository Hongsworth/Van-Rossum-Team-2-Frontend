<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PuppyLand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/styles.css" />
  </head>
  <body class="body-montserrat-regular">
    <!-- Header -->
    <header class="heading">
      <h1 class="heading__title imperial-script-regular">PuppyLand</h1>
    </header>

    <!-- Nav -->
    <nav id="navbar"></nav>

    <!-- Grid Feed -->
    <form class="search" method="get">
      <input class="search__input" type="search" placeholder="Search.." />
      <button class="search__button" type="submit">Submit</button>
    </form>
    <section class="grid">
      <div class="grid__container"></div>
    </section>

    <script type="module" src="../../scripts/index.js"></script>
    <script type="module" src="../../scripts/hamburger.js" defer></script>
    <script src="./scripts/grid.js"></script>
  </body>
</html>
